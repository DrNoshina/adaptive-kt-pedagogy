seed: 7
dataset:
  name: synthetic
  processed_root: data/processed/synthetic
  feature_set: ednet_enriched
  min_history: 3
  recent_window: 5
  max_response_time_seconds: 1200
split: {train: 0.70, validation: 0.15, test: 0.15}
baseline:
  max_train_rows: 50000
  max_validation_rows: 20000
  logistic_regression: {max_iter: 300, C: 1.0}
  random_forest: {n_estimators: 30, max_depth: 8, min_samples_leaf: 2, n_jobs: 2}
  xgboost: {n_estimators: 60, max_depth: 4, learning_rate: 0.1, subsample: 0.9, colsample_bytree: 0.9, reg_lambda: 1.0, min_child_weight: 1, early_stopping_rounds: 8}
sequence:
  max_len: 30
  batch_size: 32
  epochs: 2
  patience: 1
  learning_rate: 0.002
  weight_decay: 0.00001
  embedding_dim: 24
  hidden_dim: 32
  transformer_heads: 4
  transformer_layers: 1
  dropout: 0.1
  num_workers: 0
pedagogy: {top_k: 3, n_estimators: 60, max_depth: 4, learning_rate: 0.1, subsample: 0.9, colsample_bytree: 0.9, early_stopping_rounds: 8}
explainability: {sample_size: 50, top_features: 3}
output: {root: results/smoke}
