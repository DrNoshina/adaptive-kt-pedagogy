[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-kt-pedagogy"
version = "0.1.0"
description = "Reproducible experiments for explainable knowledge tracing and pedagogical recommendation."
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "torch>=2.4,<3",
  "shap>=0.46,<1",
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
  "joblib>=1.4,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "gdown>=5.2,<6"]

[project.scripts]
adaptive-kt = "adaptive_kt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
